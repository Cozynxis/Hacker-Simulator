<!doctype html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hacker Simulator | Shadow OS</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#eef4ff;background:#050b15}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid #67d8ff}.wall{height:100vh;background:radial-gradient(ellipse at 70% 20%,#193d62 0,transparent 45%),linear-gradient(140deg,#080f20,#12233a 55%,#070d19);position:relative}.wall:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 110px,#ffffff04 111px 112px);pointer-events:none}.top{position:absolute;top:0;left:0;right:0;padding:14px 22px;display:flex;justify-content:space-between;color:#b5c9dd;font-size:13px}.brand{font-weight:800;letter-spacing:3px;color:#a9dfff}.icons{position:absolute;top:72px;left:26px;display:grid;grid-template-columns:repeat(2,100px);gap:15px}.desktop-icon{border:1px solid transparent;background:transparent;color:#e9f3ff;border-radius:12px;padding:12px 4px;display:grid;justify-items:center;gap:8px}.desktop-icon:hover{background:#ffffff12;border-color:#ffffff25}.desktop-icon b{font-size:27px}.desktop-icon span{font-size:12px}.taskbar{position:absolute;bottom:0;left:0;right:0;height:62px;background:#0b1324ed;backdrop-filter:blur(24px);border-top:1px solid #ffffff1c;display:flex;align-items:center;justify-content:center;gap:9px;z-index:30}.taskbar button{height:43px;min-width:43px;background:#ffffff0c;color:white;border:1px solid #ffffff1c;border-radius:11px;font-size:19px}.taskbar button:hover{background:#ffffff24}.clock{position:absolute;right:22px;font-size:12px;color:#bcd0e3}.window{position:absolute;width:min(760px,90vw);height:min(530px,75vh);left:calc(50% - min(380px,45vw));top:11%;background:#0e1929f5;border:1px solid #41608088;border-radius:14px;box-shadow:0 25px 85px #000b;overflow:hidden;display:flex;flex-direction:column;animation:appear .22s ease-out;z-index:5}.window.small{width:min(520px,90vw);height:420px;left:calc(50% - min(260px,45vw))}@keyframes appear{from{opacity:0;transform:translateY(13px) scale(.97)}to{opacity:1;transform:none}}.bar{height:46px;flex-shrink:0;background:#192b40;display:flex;align-items:center;justify-content:space-between;padding:0 13px;cursor:grab;user-select:none}.bar button{background:#253c56;border:0;color:#fff;border-radius:7px;width:28px;height:28px}.content{padding:20px;overflow:auto;flex:1}.muted{color:#a5b9ce}.pill{background:#183953;color:#7bd7ff;padding:5px 9px;border-radius:8px;font-size:12px}.btn{background:#1979c4;color:#fff;border:1px solid #3497e2;border-radius:9px;padding:10px 14px;margin:4px 5px 4px 0}.btn:hover{background:#2995e5}.btn.secondary{background:#203349;border-color:#405775}.card{padding:16px;background:#17283c;border:1px solid #344c65;border-radius:12px;margin:10px 0}.chat{display:flex;flex-direction:column;gap:10px}.bubble{max-width:85%;padding:12px;border-radius:12px;background:#233b54;line-height:1.55}.bubble.self{align-self:flex-end;background:#165b85}.terminal{background:#050a11;color:#8fffc2;border-radius:9px;padding:14px;min-height:260px;font:13px/1.7 Consolas,monospace;white-space:pre-wrap}.terminal input{background:transparent;border:0;color:#8fffc2;outline:0;width:70%;font:inherit}.overlay{position:fixed;inset:0;background:#030a14ee;z-index:80;display:grid;place-items:center}.welcome{max-width:500px;padding:34px;background:#111f31;border:1px solid #385572;border-radius:20px;text-align:center;box-shadow:0 25px 90px #000b}.welcome h1{font-size:36px;margin:10px 0}.tutorial{position:absolute;right:24px;bottom:85px;width:min(380px,calc(100vw - 40px));background:#15263b;border:1px solid #55a2d4;border-radius:14px;padding:18px;z-index:50;box-shadow:0 15px 45px #0009}.toast{position:absolute;right:24px;top:60px;z-index:65;background:#193650;border:1px solid #3d88b4;border-radius:12px;padding:14px;animation:appear .3s}.progress{height:9px;background:#253b50;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#2da7ef,#73e0e4);transition:width .4s}.file{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18;padding:11px 0}.status{position:absolute;bottom:76px;left:24px;color:#abc8dc;font-size:12px}.choice{display:grid;gap:8px;margin-top:14px}.choice button{text-align:left}.mission{border-left:3px solid #5dc8ff;padding-left:12px}.lock{font-size:42px}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:16px 0}input[type=range]{accent-color:#39b7ed}body.reduce *{animation:none!important;transition:none!important}@media(max-width:650px){.icons{grid-template-columns:repeat(2,90px);left:10px;top:65px}.window,.window.small{top:7%;height:78vh}.clock{display:none}.welcome{margin:18px}.top{font-size:11px}}
</style></head><body><main class="wall" id="desktop"><header class="top"><div class="brand">SHADOW OS // SIMULATION</div><div id="hud"></div></header><div class="icons" id="icons"></div><div id="windows"></div><div class="status">LOCAL SIMULATION · NO REAL NETWORK ACCESS</div><nav class="taskbar" id="taskbar"></nav><div id="extras"></div></main>
<script>
'use strict';
const APPS=[['chat','💬','GhostChat'],['missions','🎯','Missions'],['terminal','⌨️','Terminal'],['school','🎓','School Portal'],['files','📁','Files'],['wallet','💳','Wallet'],['upgrades','🖥️','Upgrades'],['settings','⚙️','Settings']];
const KEY='shadow-os-save-v2';
const fresh=()=>({stage:0,credits:0,xp:0,level:1,tutorial:0,solved:false,grade:false,volume:.35,music:false,reduce:false,upgrades:[],messages:[],booted:false});
let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=fresh()}
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));hud()};
const $=id=>document.getElementById(id), escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let audioCtx;function sound(type='click'){if(!state.volume)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type=type==='error'?'sawtooth':'sine';const f={click:510,message:730,success:880,error:170,boot:340,type:440}[type]||510;o.frequency.setValueAtTime(f,audioCtx.currentTime);if(type==='success')o.frequency.exponentialRampToValueAtTime(1320,audioCtx.currentTime+.17);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(Math.max(.0002,state.volume*.09),audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);o.start();o.stop(audioCtx.currentTime+.23)}catch{}}
function toast(msg){$('extras').querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=msg;$('extras').append(t);setTimeout(()=>t.remove(),3300)}
function hud(){$('hud').textContent='LVL '+state.level+'  ·  '+state.xp+' XP  ·  ₡'+state.credits.toLocaleString('nl-NL');document.body.classList.toggle('reduce',state.reduce)}
function gain(xp,credits){state.xp+=xp;state.credits+=credits;state.level=1+Math.floor(state.xp/150);save();sound('success');toast('MISSION REWARD  +'+xp+' XP  +₡'+credits)}
function drawIcons(){$('icons').innerHTML=APPS.map(([id,ico,name])=>'<button class="desktop-icon" data-app="'+id+'"><b>'+ico+'</b><span>'+name+'</span></button>').join('');$('taskbar').innerHTML='<button data-app="missions" title="Start">◈</button>'+APPS.slice(0,5).map(([id,ico,name])=>'<button data-app="'+id+'" title="'+name+'">'+ico+'</button>').join('')+'<span class="clock" id="clock"></span>';document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>{sound();openApp(b.dataset.app)}));hud();updateClock()}
function updateClock(){let c=$('clock');if(c)c.textContent=new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}setInterval(updateClock,30000);
let z=10;function openApp(id){const old=$('win-'+id);if(old){old.style.zIndex=++z;return}const app=APPS.find(a=>a[0]===id);if(!app)return;let w=document.createElement('section');w.className='window'+(['settings','wallet','upgrades'].includes(id)?' small':'');w.id='win-'+id;w.style.zIndex=++z;w.innerHTML='<div class="bar"><strong>'+app[1]+' '+app[2]+'</strong><button aria-label="Close">×</button></div><div class="content" id="body-'+id+'"></div>';w.querySelector('.bar button').onclick=()=>{sound();w.remove()};$('windows').append(w);drag(w);render(id)}
function drag(w){let bar=w.querySelector('.bar'),start;bar.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;start={x:e.clientX,y:e.clientY,l:w.offsetLeft,t:w.offsetTop};bar.setPointerCapture(e.pointerId);w.style.zIndex=++z});bar.addEventListener('pointermove',e=>{if(!start)return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,start.l+e.clientX-start.x))+'px';w.style.top=Math.max(0,Math.min(innerHeight-100,start.t+e.clientY-start.y))+'px'});bar.addEventListener('pointerup',()=>start=null)}
function render(id){let b=$('body-'+id);if(!b)return;const views={chat:chatView,missions:missionView,terminal:terminalView,school:schoolView,files:filesView,wallet:walletView,upgrades:upgradeView,settings:settingsView};b.innerHTML=views[id]();b.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>action(btn.dataset.action)));if(id==='terminal'){let input=b.querySelector('#cmd');input?.addEventListener('keydown',e=>{if(e.key==='Enter'){command(input.value);sound('type')}})}}
function rerender(){for(const [id] of APPS)if($('body-'+id))render(id)}
function chatView(){let messages=state.messages.length?state.messages:['UNKNOWN_01: You finally came online.','UNKNOWN_01: I have a job for you. Open Missions and read the briefing.'];return '<p class="muted">Encrypted fictional story channel · LOCAL</p><div class="chat">'+messages.map(m=>'<div class="bubble '+(m.startsWith('YOU:')?'self':'')+'">'+escapeHTML(m)+'</div>').join('')+'</div><div class="card"><button class="btn" data-action="reply">Reply</button><button class="btn secondary" data-action="openMissions">View mission</button></div>'}
function missionView(){return '<h2>Story Campaign</h2><div class="card mission"><span class="pill">CHAPTER 01</span><h2>The First Message</h2><p>A mysterious contact wants you to audit a fictional school test environment. Recover a simulated access token and update a sample record.</p><div class="progress"><div style="width:'+(state.stage===0?8:state.stage===1?35:state.stage===2?70:100)+'%"></div></div><p>'+(['Open GhostChat and accept the mission.','Solve the simulated terminal puzzle.','Update the sandbox grade record.','Mission complete!'][state.stage]||'Complete')+'</p><button class="btn" data-action="'+(state.stage===0?'accept':state.stage===1?'openTerminal':state.stage===2?'openSchool':'openChat')+'">'+(state.stage===0?'Accept mission':state.stage===1?'Open Terminal':state.stage===2?'Open School Portal':'Open GhostChat')+'</button></div><div class="card"><span class="pill">CHAPTER 02 · '+(state.stage>=3?'UNLOCKED':'LOCKED')+'</span><h3>Digital Underground</h3><p>'+(state.stage>=3?'A new message is waiting. The next chapter is planned for a future update.':'Finish Chapter 01 to unlock.')+'</p></div>'}
function terminalView(){return '<h3>Shadow Terminal</h3><p class="muted">Game commands: help, status, scan, inspect, decode, clear</p><div class="terminal" id="terminal-output">SHADOW OS SIMULATION CONSOLE\nNo real network tools are available.\n\n'+escapeHTML(window.termLog||'Type help to begin.')+'\n\nshadow@local:~$ <input id="cmd" autocomplete="off" aria-label="Terminal command"></div>'}
function command(raw){const cmd=raw.trim().toLowerCase();let response;if(cmd==='help')response='Commands: help, status, scan, inspect, decode, clear';else if(cmd==='status')response='SIMULATION ONLINE | STORY PHASE '+state.stage;else if(cmd==='scan')response=state.stage>=1?'Found: SCHOOL-SANDBOX-01 (fictional) | Puzzle key fragments: BLUE + 42':'No active mission. Accept Chapter 01 first.';else if(cmd==='inspect')response='SANDBOX FILE: color=BLUE, number=42. Combine as BLUE42.';else if(cmd==='decode'){if(state.stage===1){state.stage=2;state.solved=true;save();gain(50,150);response='PUZZLE COMPLETE. Sandbox access granted. Open School Portal.'}else response='No puzzle pending.'}else if(cmd==='clear'){window.termLog='';render('terminal');return}else response='Unknown command. Try help.';window.termLog=(window.termLog||'')+'\n> '+cmd+'\n'+response;render('terminal');$('cmd')?.focus();rerender()}
function schoolView(){return '<h2>Westbridge Academy — Sandbox</h2><p class="muted">Fictional sample database · This does not connect to any school.</p><div class="card"><h3>Student record #DEMO-204</h3><p>Name: Alex Morgan</p><p>Subject: Computer Science</p><p>Test grade: <strong>'+(state.grade?'8.5':'5.5')+'</strong></p><p>Access: '+(state.stage>=2?'Sandbox authorized':'Locked')+'</p>'+(state.stage===2?'<button class="btn" data-action="grade">Update demo grade to 8.5</button>':state.stage<2?'<p class="muted">Complete the terminal puzzle first.</p>':'<span class="pill">Record updated</span>')+'</div>'}
function filesView(){return '<h2>My Files</h2>'+[['readme.txt','Welcome to Shadow OS. Everything here is fictional.'],['mission-01.txt','The First Message: inspect the sandbox, then update the demo record.'],['clue.txt','Use the terminal commands scan, inspect and decode.']].map(([n,t])=>'<div class="file"><span>📄 '+n+'</span><button class="btn secondary" data-action="file:'+n+'">Open</button></div>').join('')}
function walletView(){return '<h2>Shadow Wallet</h2><p class="muted">Virtual game currency only</p><h1>₡'+state.credits.toLocaleString('nl-NL')+'</h1><div class="card">Rewards from completed story missions appear here.</div>'}
function upgradeView(){return '<h2>Hardware Store</h2><p class="muted">Buy fictional upgrades with mission credits.</p>'+[['ram','RAM Expansion',100],['cpu','Processor Boost',250],['theme','Blue Neon Theme',400]].map(([id,n,p])=>'<div class="file"><span>'+n+' — ₡'+p+'</span><button class="btn" data-action="buy:'+id+'" '+(state.upgrades.includes(id)?'disabled':'')+'>'+(state.upgrades.includes(id)?'Owned':'Buy')+'</button></div>').join('')}
function settingsView(){return '<h2>Settings</h2><div class="settings-row"><label for="volume">Sound volume</label><input id="volume" type="range" min="0" max="1" step=".05" value="'+state.volume+'"></div><div class="settings-row">Reduced animations <button class="btn secondary" data-action="motion">'+(state.reduce?'On':'Off')+'</button></div><div class="card">Progress saves automatically on this device.</div><button class="btn secondary" data-action="tutorial">Replay tutorial</button><button class="btn secondary" data-action="reset">Reset save</button>'}
function action(a){sound();if(a==='accept'&&state.stage===0){state.stage=1;state.messages.push('YOU: I accept the job.','UNKNOWN_01: Great. Use the Terminal. Start with scan.');save();sound('message');toast('MISSION ACCEPTED')}else if(a==='grade'&&state.stage===2){state.stage=3;state.grade=true;state.messages.push('UNKNOWN_01: Well done. You have been noticed.');save();gain(100,350);toast('CHAPTER 01 COMPLETE')}else if(a==='reply'){state.messages.push('YOU: I am ready.','UNKNOWN_01: Check your Missions app.');save()}else if(a.startsWith('open')){const m={openMissions:'missions',openTerminal:'terminal',openSchool:'school',openChat:'chat'};openApp(m[a])}else if(a.startsWith('file:'))toast(a.slice(5)+': See the Files description and mission briefing.');else if(a.startsWith('buy:')){const id=a.slice(4),prices={ram:100,cpu:250,theme:400};if(state.upgrades.includes(id))return;if(state.credits<prices[id]){sound('error');toast('Not enough credits')}else{state.credits-=prices[id];state.upgrades.push(id);save();toast('Upgrade purchased')}}else if(a==='motion'){state.reduce=!state.reduce;save()}else if(a==='tutorial'){state.tutorial=0;save();tutorial()}else if(a==='reset'){if(confirm('Delete your local progress and restart?')){state=fresh();save();location.reload()}}if(a==='accept'&&state.tutorial===2){state.tutorial=3;save();tutorial()}rerender();if(a==='tutorial')return;const slider=$('volume');if(slider)slider.oninput=e=>{state.volume=Number(e.target.value);save()}}
const tutorialSteps=[['Welcome to Shadow OS','This is your virtual computer. All systems and identities are fictional.'],['Meet GhostChat','Open GhostChat to read your mysterious contact’s message.'],['Start your mission','Open Missions and accept Chapter 01.'],['Use the Terminal','Open Terminal and type scan, inspect and decode to solve the puzzle.'],['Finish the mission','Open School Portal and update the fictional demo record.'],['You are ready','Explore Files, Wallet, Upgrades and Settings. Your progress saves automatically.']];
function tutorial(){let old=$('tutorial');old?.remove();if(state.tutorial>=tutorialSteps.length)return;const [title,desc]=tutorialSteps[state.tutorial];let el=document.createElement('div');el.id='tutorial';el.className='tutorial';el.innerHTML='<span class="pill">TUTORIAL '+(state.tutorial+1)+' / '+tutorialSteps.length+'</span><h3>'+title+'</h3><p>'+desc+'</p><button class="btn" id="next-tutorial">'+(state.tutorial===5?'Finish':'Next →')+'</button><button class="btn secondary" id="skip-tutorial">Skip</button>';$('extras').append(el);$('next-tutorial').onclick=()=>{sound();state.tutorial++;save();tutorial()};$('skip-tutorial').onclick=()=>{state.tutorial=6;save();tutorial()}}
function boot(){drawIcons();if(!state.booted){let overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML='<div class="welcome"><div class="lock">◈</div><h1>SHADOW OS</h1><p class="muted">HACKER SIMULATOR · STORY MODE</p><p>Fictional cyber-thriller. No real hacking or financial transactions.</p><button class="btn" id="start">START SYSTEM →</button></div>';document.body.append(overlay);$('start').onclick=()=>{sound('boot');state.booted=true;save();overlay.remove();openApp('chat');tutorial()}}else{openApp('chat');if(state.tutorial<6)tutorial()}}
document.addEventListener('pointerdown',e=>{if(e.target.matches('button')&&!e.target.closest('.window')&&!e.target.closest('.tutorial'))sound('click')});
boot();
</script></body></html>
